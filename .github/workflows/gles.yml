name: Build LWJGL OpenGLES (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      NDK_VERSION: r21e
      LWJGL_BUILD_ARCH: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          repository: PojavLauncherTeam/lwjgl3
          ref: master
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant build-essential autoconf libtool

      - name: Setup Android NDK
        run: |
          cd $GITHUB_WORKSPACE
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux-x86_64.zip
          unzip -q android-ndk-${NDK_VERSION}-linux-x86_64.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Create Build Script
        run: |
          cat << 'EOF' > ci_build.bash
          #!/bin/bash
          set -e
          export LIBFFI_VERSION=3.4.6
          export ANDROID=1 LWJGL_BUILD_OFFLINE=1
          
          # Setup env
          if [ "$LWJGL_BUILD_ARCH" == "arm64" ]; then
            export NDK_ABI=arm64-v8a NDK_TARGET=aarch64
          fi

          export TARGET=$NDK_TARGET-linux-android$NDK_SUFFIX
          export PATH=$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          LWJGL_NATIVE=bin/libs/native/linux/$LWJGL_BUILD_ARCH/org/lwjgl
          mkdir -p $LWJGL_NATIVE

          # --- 1. 下载并编译依赖 (libffi, freetype) ---
          if [ "$SKIP_LIBFFI" != "1" ]; then
            if [ ! -d libffi ]; then
              wget -q https://github.com/libffi/libffi/releases/download/v$LIBFFI_VERSION/libffi-$LIBFFI_VERSION.tar.gz
              tar xf libffi-$LIBFFI_VERSION.tar.gz
              mv libffi-$LIBFFI_VERSION libffi
            fi
            cd libffi
            bash configure --host=$TARGET --prefix=$PWD/$NDK_TARGET-unknown-linux-android$NDK_SUFFIX CC=${TARGET}21-clang CXX=${TARGET}21-clang++
            make -j4
            cd ..
            cp libffi/$NDK_TARGET-linux-android$NDK_SUFFIX/.libs/libffi.a $LWJGL_NATIVE/
          fi

          if [ "$SKIP_FREETYPE" != "1" ]; then
            export BUILD_FREETYPE_VERSION=2.13.2
            wget -q https://downloads.sourceforge.net/project/freetype/freetype2/$BUILD_FREETYPE_VERSION/freetype-$BUILD_FREETYPE_VERSION.tar.gz
            tar xf freetype-$BUILD_FREETYPE_VERSION.tar.gz
            cd freetype-$BUILD_FREETYPE_VERSION
            export CC=$NDK_TARGET-linux-android${NDK_SUFFIX}21-clang
            ./configure --host=$TARGET --prefix=`pwd`/build_android-$LWJGL_BUILD_ARCH --without-zlib --with-brotli=no --with-bzip2=no --with-png=no --with-harfbuzz=no --enable-static=no --enable-shared=yes 
            make -j4
            make install
            llvm-strip ./build_android-$LWJGL_BUILD_ARCH/lib/libfreetype.so
            cd ..
            cp freetype-$BUILD_FREETYPE_VERSION/build_android-$LWJGL_BUILD_ARCH/lib/libfreetype.so $LWJGL_NATIVE/
            rm -rf freetype-$BUILD_FREETYPE_VERSION
          fi

          # --- 2. 下载 Pojav 预编译库 ---
          POJAV_NATIVES="https://github.com/AngelAuraMC/Amethyst-Android/raw/v3_openjdk/app_pojavlauncher/src/main/jniLibs/$NDK_ABI"
          wget -q -nc $POJAV_NATIVES/libopenal.so -P $LWJGL_NATIVE/openal
          wget -q -nc "https://github.com/AngelAuraMC/shaderc/releases/latest/download/libshaderc-$NDK_ABI.zip"
          unzip -o libshaderc-$NDK_ABI.zip -d $LWJGL_NATIVE/shaderc

          # --- 3. 初始化并构建 LWJGL (修复部分) ---
          
          echo "Initializing dependencies..."
          # 这一步非常重要，它会下载 Kotlin 编译器等用于生成代码的工具
          ant init

          echo "Starting Build..."
          # 删除了所有的 HACK (mkdir/touch)，让 ant 真实地去生成代码
          
          # 注意：这里移除了 LWJGL_BUILD_OFFLINE=1，因为 ant init 需要联网下载
          export LWJGL_BUILD_OFFLINE=0

          yes | ant -Dplatform.linux=true \
            -Dbinding.opengles=true \
            -Dbinding.egl=true \
            -Dbinding.assimp=false \
            -Dbinding.bgfx=false \
            -Dbinding.cuda=false \
            -Dbinding.fmod=false \
            -Dbinding.harfbuzz=false \
            -Dbinding.hwloc=false \
            -Dbinding.jawt=false \
            -Dbinding.jemalloc=false \
            -Dbinding.ktx=false \
            -Dbinding.libdivide=false \
            -Dbinding.llvm=false \
            -Dbinding.lmdb=false \
            -Dbinding.lz4=false \
            -Dbinding.meow=false \
            -Dbinding.meshoptimizer=false \
            -Dbinding.nfd=false \
            -Dbinding.nuklear=false \
            -Dbinding.odbc=false \
            -Dbinding.opencl=false \
            -Dbinding.openvr=false \
            -Dbinding.openxr=false \
            -Dbinding.opus=false \
            -Dbinding.par=false \
            -Dbinding.remotery=false \
            -Dbinding.rpmalloc=false \
            -Dbinding.spvc=false \
            -Dbinding.sse=false \
            -Dbinding.tinyexr=false \
            -Dbinding.tootle=false \
            -Dbinding.xxhash=false \
            -Dbinding.yoga=false \
            -Dbinding.zstd=false \
            -Dbuild.type=release/3.3.3 \
            -Djavadoc.skip=true \
            -Dnashorn.args="--no-deprecation-warning" \
            compile compile-native release

          # --- 4. 收集产物 ---
          rm -rf bin/out; mkdir bin/out
          find $LWJGL_NATIVE -name 'liblwjgl*.so' -exec cp {} bin/out/ \;
          cp $LWJGL_NATIVE/shaderc/libshaderc.so bin/out/
          if [ -e "$LWJGL_NATIVE/libfreetype.so" ]; then
            cp $LWJGL_NATIVE/libfreetype.so bin/out/
          fi
          EOF

      - name: Run Build
        run: |
          chmod +x ci_build.bash
          bash ci_build.bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-opengles-arm64
          path: bin/out/*.so
