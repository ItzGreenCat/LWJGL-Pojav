name: Build LWJGL for Android

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build:
    name: Compile Android Native Libs
    runs-on: ubuntu-latest

    env:
      # 设置 NDK 版本，r21e 是编译很多图形库的黄金版本
      NDK_VERSION: r21e 
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r21e

    steps:
      # 1. 拉取代码
      - name: Checkout LWJGL 3
        uses: actions/checkout@v3
        with:
          repository: LWJGL/lwjgl3
          ref: master # 或者你可以指定具体的 tag，例如 '3.3.3'
          fetch-depth: 0

      # 2. 配置 Java 环境 (Ant 需要 Java)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. 安装 Ant
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # 4. 下载并配置 Android NDK
      - name: Setup Android NDK
        id: setup-ndk
        run: |
          echo "Downloading NDK ${NDK_VERSION}..."
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux-x86_64.zip
          unzip -q android-ndk-${NDK_VERSION}-linux-x86_64.zip
          echo "NDK path set to: $ANDROID_NDK_HOME"

      # 5. 初始化 LWJGL 依赖
      # 这步会下载 Kotlin 编译器和其他构建所需的 jar 包
      - name: Initialize Build
        run: ant init

      # 6. 执行编译
      # -Dplatform=android: 告诉脚本交叉编译 Android 版本
      # release: 构建发布版本
      # 也可以加上 -Dbinding.opengles=true 来尝试只构建 GLES 模块，但全构建更稳妥
      - name: Build Android Native Libraries
        run: |
          ant release -Dplatform=android

      # 7. 整理并上传 Artifacts (产物)
      # 我们主要关注 arm64-v8a 和 armeabi-v7a 下的 so 文件
      - name: Upload OpenGL ES Shared Object
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-android-opengles
          path: |
            bin/libs/native/android/**/liblwjgl_opengles.so
            bin/libs/native/android/**/liblwjgl.so
