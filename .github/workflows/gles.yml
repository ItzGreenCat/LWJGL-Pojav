name: LWJGL3 Android Full Modules Final Solution

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build All Android Modules
        run: |
          # --- 1. 核心环境变量 ---
          export LWJGL_BUILD_ARCH=arm64
          export ANDROID=1
          export LWJGL_BUILD_OFFLINE=1
          export LIBFFI_VERSION=3.4.6
          export NDK_ABI=arm64-v8a
          export TARGET=aarch64-linux-android
          
          # 定位 NDK 工具链
          NDK_PATH=$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | sort -V | tail -n 1)
          TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PATH=$TOOLCHAIN:$PATH
          export CC=$TOOLCHAIN/${TARGET}21-clang
          export CXX=$TOOLCHAIN/${TARGET}21-clang++

          LWJGL_NATIVE=bin/libs/native/linux/$LWJGL_BUILD_ARCH/org/lwjgl
          mkdir -p $LWJGL_NATIVE

          # --- 2. 目录补全 (解决 kotlinc 路径报错) ---
          echo "正在补全所有可能的模块路径结构..."
          # 遍历所有存在的目录并确保模板路径存在，防止编译器因路径不存在而崩溃
          for dir in modules/lwjgl/*/ ; do
              mkdir -p "${dir}src/templates/kotlin"
          done

          # --- 3. 预编译 libffi ---
          if [ ! -d libffi ]; then
            wget https://github.com/libffi/libffi/releases/download/v$LIBFFI_VERSION/libffi-$LIBFFI_VERSION.tar.gz
            tar xvf libffi-$LIBFFI_VERSION.tar.gz
            mv libffi-$LIBFFI_VERSION libffi
          fi
          cd libffi
          [ -f Makefile ] && make distclean || true
          bash configure --host=$TARGET --enable-static=yes --enable-shared=no CC=$CC CXX=$CXX
          make -j4
          LIBFFI_A=$(find . -name "libffi.a" | grep ".libs" | head -n 1)
          cd ..
          cp libffi/$LIBFFI_A $LWJGL_NATIVE/

          # --- 4. 设置全量模块列表 ---
          # 包含所有支持 Android 的模块，确保 OpenXR 和 LWJGLX 的依赖能够被满足
          ALL_MODULES="core,egl,opengles,opengl,stb,rpmalloc,remotery,yoga,nanovg,nuklear,tinyfd,assimp,jemalloc,lmdb,lz4,xxhash,zstd,vulkan,vma,meshoptimizer,spvc,libdivide,meow,openxr,glfw,lwjglx"

          # --- 5. 编译参数补丁 ---
          # -std=gnu89: 修复 NDK 27 对旧 C 语法的报错
          # -lm: 链接数学库
          # -DLWJGL_ANDROID: 关键宏定义，让源码切换到安卓模式，避开 X11/GLX 桌面依赖
          FIX_FLAGS="-std=gnu89 -Wno-error -Wno-strict-prototypes -Wno-implicit-const-int-float-conversion -lm -DLWJGL_ANDROID"

          # --- 6. 执行全量 Ant 编译 ---
          # 必须同时设置 binding.glfw=true 和 binding.opengl=true，否则 lwjglx 编译会报错
          ant -Dplatform.linux=true \
            -Dlwjgl.modules=$ALL_MODULES \
            -Dbinding.core=true \
            -Dbinding.egl=true \
            -Dbinding.opengles=true \
            -Dbinding.opengl=true \
            -Dbinding.glfw=true \
            -Dbinding.lwjglx=true \
            -Dbinding.vulkan=true \
            -Dbinding.openxr=true \
            -Dbinding.stb=true \
            -Dbinding.assimp=true \
            -Dbuild.type=release/3.3.3 \
            -Djavadoc.skip=true \
            -Dcompiler.linux.cc=$CC \
            -Dcompiler.linux.cxx=$CXX \
            -Dcompiler.linux.cflags="$FIX_FLAGS" \
            -Dcompiler.linux.linkerflags="$FIX_FLAGS" \
            compile-templates compile compile-native release

          # --- 7. 提取产物 ---
          mkdir -p bin/out
          find bin/libs/native -name 'liblwjgl*.so' -exec cp {} bin/out/ \;
          echo "编译成功，产物列表："
          ls -lh bin/out/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-android-full-arm64
          path: bin/out/
