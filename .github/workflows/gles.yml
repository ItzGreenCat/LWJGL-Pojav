name: Build LWJGL3 Android Full Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build Full Android Modules
        run: |
          # 1. 基础环境变量
          export LWJGL_BUILD_ARCH=arm64
          export ANDROID=1
          export LWJGL_BUILD_OFFLINE=1
          export LIBFFI_VERSION=3.4.6
          export NDK_ABI=arm64-v8a
          export TARGET=aarch64-linux-android
          
          # 自动定位 NDK 工具链
          NDK_PATH=$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | sort -V | tail -n 1)
          TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PATH=$TOOLCHAIN:$PATH
          export CC=$TOOLCHAIN/${TARGET}21-clang
          export CXX=$TOOLCHAIN/${TARGET}21-clang++

          LWJGL_NATIVE=bin/libs/native/linux/$LWJGL_BUILD_ARCH/org/lwjgl
          mkdir -p $LWJGL_NATIVE

          # 2. 编译 libffi (核心依赖)
          if [ ! -d libffi ]; then
            wget https://github.com/libffi/libffi/releases/download/v$LIBFFI_VERSION/libffi-$LIBFFI_VERSION.tar.gz
            tar xvf libffi-$LIBFFI_VERSION.tar.gz
            mv libffi-$LIBFFI_VERSION libffi
          fi
          cd libffi
          [ -f Makefile ] && make distclean || true
          bash configure --host=$TARGET --enable-static=yes --enable-shared=no CC=$CC CXX=$CXX
          make -j4
          LIBFFI_A=$(find . -name "libffi.a" | grep ".libs" | head -n 1)
          cd ..
          cp libffi/$LIBFFI_A $LWJGL_NATIVE/

          # 3. 下载预编译的 Android 依赖 (OpenAL & Shaderc)
          # 这些是安卓上常用的第三方库，手动编译极难，通常直接使用 Pojav 提供的预编译版
          POJAV_NATIVES="https://github.com/AngelAuraMC/Amethyst-Android/raw/v3_openjdk/app_pojavlauncher/src/main/jniLibs/$NDK_ABI"
          mkdir -p $LWJGL_NATIVE/openal $LWJGL_NATIVE/shaderc
          wget -nc $POJAV_NATIVES/libopenal.so -O $LWJGL_NATIVE/openal/libopenal.so
          wget -nc "https://github.com/AngelAuraMC/shaderc/releases/latest/download/libshaderc-$NDK_ABI.zip"
          unzip -o libshaderc-$NDK_ABI.zip -d $LWJGL_NATIVE/shaderc/

          # 4. 准备编译参数 (修复 Clang 18 语法报错)
          # 注入 -DLWJGL_ANDROID 确保源码内部逻辑切换到安卓模式
          FIX_FLAGS="-std=gnu89 -Wno-error -Wno-strict-prototypes -Wno-implicit-const-int-float-conversion -lm -DLWJGL_ANDROID"

          # 5. 执行 Ant 编译 (全量模块列表)
          # 注意：lwjgl.modules 中必须包含 core,egl,opengles,opengl 才能解决 openxr 的报错
          ALL_MODULES="core,egl,opengles,opengl,stb,rpmalloc,remotery,yoga,nanovg,nuklear,tinyfd,assimp,jemalloc,lmdb,lz4,xxhash,zstd,vulkan,vma,openal,shaderc,meshoptimizer,spvc,libdivide,meow,openxr"

          ant -Dplatform.linux=true \
            -Dlwjgl.modules=$ALL_MODULES \
            -Dbinding.core=true \
            -Dbinding.egl=true \
            -Dbinding.opengles=true \
            -Dbinding.opengl=true \
            -Dbinding.openxr=true \
            -Dbinding.vulkan=true \
            -Dbinding.stb=true \
            -Dbinding.assimp=true \
            -Dbinding.shaderc=true \
            -Dbinding.openal=true \
            -Dbuild.type=release/3.3.3 \
            -Djavadoc.skip=true \
            -Dcompiler.linux.cc=$CC \
            -Dcompiler.linux.cxx=$CXX \
            -Dcompiler.linux.cflags="$FIX_FLAGS" \
            -Dcompiler.linux.linkerflags="$FIX_FLAGS" \
            compile-templates compile compile-native release

          # 6. 提取所有产物
          mkdir -p bin/out
          find bin/libs/native -name 'liblwjgl*.so' -exec cp {} bin/out/ \;
          cp $LWJGL_NATIVE/shaderc/libshaderc.so bin/out/ || true
          cp $LWJGL_NATIVE/openal/libopenal.so bin/out/ || true
          
          echo "编译完成，SO 文件如下："
          ls -lh bin/out/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-android-full-arm64
          path: bin/out/
